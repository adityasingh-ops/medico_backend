# Commit -> checks -> image -> deploy test on a throwaway cluster -> approval -> GitOps promote.
# Based on the official examples for each action:
#   docker/build-push-action  (https://docs.docker.com/build/ci/github-actions/share-image-jobs/)
#   helm/kind-action          (https://github.com/helm/kind-action)
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

# A newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/medzo-api

jobs:
  # 1) Fast checks: fail here and nothing gets built
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint chart for every environment
        run: |
          helm lint helm/medzo
          helm lint helm/medzo -f helm/medzo/values-dev.yaml
          helm lint helm/medzo -f helm/medzo/values-prod.yaml
      - name: Validate rendered manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for v in values-dev.yaml values-prod.yaml; do
            helm template medzo helm/medzo -f helm/medzo/$v | ./kubeconform -strict -summary \
              -kubernetes-version 1.31.0 -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  # 2) Build once, scan, keep the image as an artifact for the next jobs
  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            medzo-api:dev
          build-args: GIT_SHA=${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
      - name: Save image for the next jobs
        run: docker save ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }} medzo-api:dev -o /tmp/medzo-api.tar
      - uses: actions/upload-artifact@v4
        with:
          name: medzo-api-image
          path: /tmp/medzo-api.tar
          retention-days: 1

  # 3) Install the chart on a throwaway kind cluster and call the app
  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: medzo-api-image
          path: /tmp
      - run: docker load -i /tmp/medzo-api.tar
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Helm install (dev values, no Prometheus/Argo CRDs in CI)
        run: |
          kind load docker-image medzo-api:dev --name ci
          helm upgrade --install medzo helm/medzo -n medzo-ci --create-namespace \
            -f helm/medzo/values-dev.yaml \
            --set monitoring.serviceMonitor.enabled=false \
            --set monitoring.prometheusRule.enabled=false \
            --set ingress.enabled=false \
            --set tracing.enabled=false \
            --wait --timeout 5m
      - name: Helm test (readyz + version from inside the cluster)
        run: helm test medzo -n medzo-ci --logs
      - name: Smoke test through the Service
        run: |
          kubectl port-forward -n medzo-ci svc/medzo 5858:5858 &
          sleep 3
          curl -sf localhost:5858/readyz
          curl -sf localhost:5858/version | tee /dev/stderr | grep -q '"version":"dev"'
          curl -sf localhost:5858/api/categories
      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods,events -n medzo-ci
          kubectl logs -n medzo-ci -l app.kubernetes.io/component=api --tail=100

  # 4) main only: push the tested image to GHCR
  publish:
    needs: [build, deploy-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: medzo-api-image
          path: /tmp
      - run: docker load -i /tmp/medzo-api.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact image that passed the tests
        run: docker push ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}

  # 5) Manual approval (GitHub environment "production"), then write the new
  #    tag into git. Argo CD sees the commit and rolls it out as a canary.
  promote:
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image.tag in values-prod.yaml
        run: |
          TAG=${{ needs.build.outputs.tag }}
          sed -i -E "s/^(  tag: ).*/\1\"$TAG\"/" helm/medzo/values-prod.yaml
          grep -n 'tag:' helm/medzo/values-prod.yaml
      - name: Commit the release to git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: medzo-api ${{ needs.build.outputs.tag }} to prod [skip ci]"
          git push
