{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
# Dev/CI only. Prod uses secrets.existingSecret created outside git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medzo.secretName" . }}
  labels:
    {{- include "medzo.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGODB_URI: "mongodb://{{ $s.mongoRootUser }}:{{ $s.mongoRootPassword }}@{{ include "medzo.fullname" . }}-mongodb:27017/{{ .Values.mongodb.database }}?authSource=admin"
  JWT_SECRET: {{ $s.jwtSecret | quote }}
  ANTHROPIC_API_KEY: {{ $s.anthropicApiKey | quote }}
  TWO_FACTOR_API_KEY: {{ $s.twoFactorApiKey | quote }}
  MONGO_ROOT_USER: {{ $s.mongoRootUser | quote }}
  MONGO_ROOT_PASSWORD: {{ $s.mongoRootPassword | quote }}
{{- end }}
