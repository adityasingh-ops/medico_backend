# GitOps: Argo CD keeps namespace medzo-prod equal to helm/medzo + values-prod.yaml
# on the main branch. Format from the Argo CD declarative setup docs:
# https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/#applications
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medzo-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/adityasingh-ops/medico_backend.git
    targetRevision: main
    path: helm/medzo
    helm:
      releaseName: medzo
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: medzo-prod
  syncPolicy:
    automated:
      prune: true      # delete what was removed from git
      selfHeal: true   # undo manual kubectl changes (drift)
    syncOptions:
      - CreateNamespace=true
  # The HPA owns the replica count, so do not report it as drift
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
