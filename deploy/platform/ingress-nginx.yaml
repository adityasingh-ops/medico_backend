# ingress-nginx on kind: listen on the control-plane node's host ports 80/443,
# which cluster.yaml maps to localhost.
controller:
  hostPort:
    enabled: true
  service:
    type: NodePort
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  watchIngressWithoutClass: false
  ingressClassResource:
    default: true
  # Expose controller metrics to Prometheus as well
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
