# Loki in single-binary mode with filesystem storage: enough for one laptop.
# Follows "Install the monolithic Helm chart" in the Loki docs:
# https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi

# Turn off everything the scalable modes need
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
memcached: { enabled: false }
memcachedExporter: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
