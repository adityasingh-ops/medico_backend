# Local UIs through ingress-nginx, no port-forward needed:
#   http://grafana.localhost  http://prometheus.localhost  http://jaeger.localhost
#   http://alertmanager.localhost
# *.localhost resolves to 127.0.0.1 in browsers and curl.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ui
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: monitoring-grafana, port: { number: 80 } }
    - host: prometheus.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: monitoring-kube-prometheus-prometheus, port: { number: 9090 } }
    - host: alertmanager.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: monitoring-kube-prometheus-alertmanager, port: { number: 9093 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ui
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: jaeger.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: jaeger-query, port: { number: 16686 } }
