# 3-node local cluster. Based on the kind ingress guide:
# https://kind.sigs.k8s.io/docs/user/ingress/
# Two workers so topology spread, PodDisruptionBudgets and node failure can be shown.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: medzo
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # localhost:80 on the Mac -> ingress-nginx on this node
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
